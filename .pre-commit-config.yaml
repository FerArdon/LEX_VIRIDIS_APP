# LEX VIRIDIS - Pre-commit Hooks Configuration
# Instalar: pip install pre-commit
# Activar: pre-commit install

repos:
  # Ruff - Linting y formateo ultrarrápido
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.0
    hooks:
      # Linter
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      # Formatter
      - id: ruff-format

  # Hooks básicos de pre-commit
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending

  # MyPy - Type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        args: [--ignore-missing-imports, --no-strict-optional, --follow-imports=silent]
        exclude: ^(tests/|scripts/)

  # Seguridad - Bandit
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.7
    hooks:
      - id: bandit
        # -f json: evita crash UnicodeEncodeError cp1252 en Windows (bug bandit con chars Unicode en fuente)
        # --exit-zero: reporta hallazgos sin bloquear commits (issues pre-existentes se rastrean por separado)
        args: [-ll, --skip, B101, -f, json, --exit-zero]
        exclude: ^tests/
