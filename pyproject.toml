[project]
name = "lex-viridis"
version = "3.0.0"
description = "Buscador Juridico Ambiental de Honduras"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    ".venv",
    "build",
    "dist",
    "__pycache__",
    "scripts",
    "web/frontend/node_modules",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E722",   # bare-except (se corregira en Fase 4)
    "E501",   # line-too-long (se corregira gradualmente)
    "E701",   # multiple-statements-on-one-line (pre-existente)
    "E402",   # module-import-not-at-top (pre-existente, sys.path manipulation)
    "F841",   # local-variable-is-assigned-to-but-never-used (pre-existente)
    "E741",   # ambiguous-variable-name (pre-existente)
    "B904",   # raise-without-from-inside-except (pre-existente)
    "F811",   # redefinition-of-unused-name (pre-existente)
    "B007",   # unused-loop-control-variable (pre-existente)
    "UP038",  # non-pep604-isinstance (requiere Python 3.10+, dejar para refactor)
    "E731",   # lambda-assignment (pre-existente, Flet usa lambdas en callbacks)
]

[tool.ruff.lint.isort]
known-first-party = ["lexviridis"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "scripts/",
    "web/frontend/",
    "\\.venv/",
]
# Deshabilitar categorías con errores pre-existentes en la base de código
disable_error_code = [
    "var-annotated",
    "attr-defined",
    "no-redef",
    "valid-type",
    "assignment",
    "return-value",
    "has-type",
    "func-returns-value",
    "misc",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
